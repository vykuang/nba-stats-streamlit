services:
  minio:
    image: quay.io/minio/minio
    # entrypoint: ["server", "/data", "--console-address", ":9001"]
    command: server --console-address ":9001" 
    container_name: minio
    ports:
      - "9098:9000"
      - "9099:9001"
    # expose:
    #   - "9000"
    #   - "9001"
    volumes:
      - ./.minio/data:/data
    env_file:
      - .env